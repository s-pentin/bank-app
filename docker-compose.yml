services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: ${DB_USERNAME:-bank_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bank_password}
    volumes:
      - ./init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bank_user}"]
      interval: 5s
      timeout: 5s
      retries: 10

  consul:
    image: hashicorp/consul:1.19
    command: agent -dev -client=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 15

  consul-config-import:
    image: hashicorp/consul:1.19
    depends_on:
      consul:
        condition: service_healthy
    volumes:
      - ./consul/config/application.json:/config/application.json:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'consul kv import -http-addr=http://consul:8500 @/config/application.json'

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: keycloak
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_PORT: "8180"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8180:8180"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8180"]
      interval: 10s
      timeout: 5s
      retries: 15

  accounts-service:
    build:
      context: .
      dockerfile: accounts-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-bank_user}
      DB_PASSWORD: ${DB_PASSWORD:-bank_password}
      CONSUL_HOST: consul
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank
      ACCOUNTS_CLIENT_SECRET: ${ACCOUNTS_CLIENT_SECRET:-accounts-service-secret}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      consul-config-import:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  cash-service:
    build:
      context: .
      dockerfile: cash-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-bank_user}
      DB_PASSWORD: ${DB_PASSWORD:-bank_password}
      CONSUL_HOST: consul
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank
      CASH_CLIENT_SECRET: ${CASH_CLIENT_SECRET:-cash-service-secret}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      consul-config-import:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  transfer-service:
    build:
      context: .
      dockerfile: transfer-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-bank_user}
      DB_PASSWORD: ${DB_PASSWORD:-bank_password}
      CONSUL_HOST: consul
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank
      TRANSFER_CLIENT_SECRET: ${TRANSFER_CLIENT_SECRET:-transfer-service-secret}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      consul-config-import:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  notifications-service:
    build:
      context: .
      dockerfile: notifications-service/Dockerfile
    environment:
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-bank_user}
      DB_PASSWORD: ${DB_PASSWORD:-bank_password}
      CONSUL_HOST: consul
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
      consul-config-import:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8090:8090"
    environment:
      CONSUL_HOST: consul
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank
    depends_on:
      consul:
        condition: service_started
      consul-config-import:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
      accounts-service:
        condition: service_started
      cash-service:
        condition: service_started
      transfer-service:
        condition: service_started

  front:
    build:
      context: .
      dockerfile: front/Dockerfile
    ports:
      - "8080:8080"
    environment:
      GATEWAY_BASE_URL: http://gateway:8090
      KEYCLOAK_ISSUER_URI: http://keycloak:8180/realms/bank
    depends_on:
      gateway:
        condition: service_started
      keycloak:
        condition: service_healthy
