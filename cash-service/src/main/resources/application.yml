spring:
  application:
    name: cash-service
  config:
    import: "optional:consul:"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/bank?currentSchema=cash
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    schemas: cash
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        service-name: cash-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/bank}
      client:
        registration:
          cash-service:
            client-id: cash-service
            client-secret: ${CASH_CLIENT_SECRET:cash-service-secret}
            authorization-grant-type: client_credentials
            scope:
              - accounts.internal
              - notifications.write
        provider:
          cash-service:
            token-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8180/realms/bank}/protocol/openid-connect/token

server:
  port: 8082

app:
  accounts:
    base-url: http://accounts-service
  notifications:
    base-url: http://notifications-service
  outbox:
    poll-interval: PT5S
    max-attempts: 5
